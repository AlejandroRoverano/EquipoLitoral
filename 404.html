<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- RNF-11: modo oscuro y tamaño de letra (antes de dibujar la página) -->
    <script src="/preferencias.js"></script>
    <title>Página no encontrada | Equipo Litoral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos incluidos acá a propósito: esta página se sirve desde cualquier ruta inexistente y las rutas relativas fallarían -->
    <style>
        body { background: linear-gradient(135deg, #eff4ff 0%, #fff 100%); color: #0b1c30; font-family: "Inter", system-ui, sans-serif; }
        .error-card { max-width: 480px; border: 1px solid #d3e4fe; border-radius: 1rem; background: #fff; }
        .error-code { color: #006b5a; font-weight: 700; letter-spacing: .05em; }
        .btn-litoral { background: #002b5b; border-color: #002b5b; color: #fff; }
        .btn-litoral:hover { background: #001736; border-color: #001736; color: #fff; }
        :focus-visible { outline: 3px solid #54f8d7; outline-offset: 2px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 px-3">
    <main class="error-card shadow-sm p-4 p-md-5 text-center w-100">
        <i class="bi bi-compass fs-1 text-secondary" aria-hidden="true"></i>
        <p class="error-code mt-2 mb-1">ERROR 404</p>
        <h1 class="h3 fw-bold">Página no encontrada</h1>
        <p class="text-secondary">La dirección que buscás no existe o fue movida. Revisá que esté bien escrita o volvé al inicio de Equipo Litoral.</p>
        <a id="volver-inicio" href="/" class="btn btn-litoral btn-lg w-100"><i class="bi bi-house me-2" aria-hidden="true"></i>Volver al inicio</a>
    </main>

    <script>
        // En GitHub Pages el sitio vive en /EquipoLitoral/; en Firebase Hosting, en la raíz.
        if (location.pathname.indexOf("/EquipoLitoral/") === 0) {
            document.getElementById("volver-inicio").href = "/EquipoLitoral/";
        }
    </script>
</body>
</html>
